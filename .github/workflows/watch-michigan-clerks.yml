name: Watch Michigan county election-results websites
on:
  push:
    branches: [main]
    paths:
      - 'scripts/watch_michigan_clerks.py'
      - 'michigan/election-night/county_watch_sources.json'
      - 'tests/test_clerk_watch.py'
      - '.github/workflows/watch-michigan-clerks.yml'
  schedule:
    - cron: '19 1,7,13,19 * * *'
    # Election day afternoon and overnight, UTC. GitHub cron is best effort.
    - cron: '*/15 0-8 4 11 *'
    - cron: '*/30 18-23 3 11 *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: michigan-clerk-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source discovery and first-run safety
        run: python3 -m unittest discover -s tests -p test_clerk_watch.py -v
      - name: Check all 83 clerk public websites
        run: python3 scripts/watch_michigan_clerks.py
      - name: Validate county monitor snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('michigan/election-night/clerk_watch.json')
          d=json.loads(p.read_text())
          assert d['coverage']==83 and len(d['counties'])==83
          assert sum(d['summary'][k] for k in ('reachable','indeterminate','unavailable'))==83
          assert all(v['status'] in ('reachable','indeterminate','unavailable') for v in d['counties'].values())
          print('PASS: all 83 county monitoring records accounted for')
          PY
      - name: Publish updated clerk-check status and link alerts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A source-check job may start on an older commit while another
          # automation writes fresh status files. Recompute from the newest
          # baseline instead of rebasing two generated JSON snapshots.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python3 scripts/watch_michigan_clerks.py
            fi
            git add michigan/election-night/clerk_watch.json michigan/election-night/clerk_watch_events.json
            if git diff --cached --quiet; then
              echo "No new changes to publish."
              break
            fi
            git commit -m "Check all Michigan county election results websites"
            if git push origin HEAD:main; then
              echo "County status published."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish after 3 attempts" >&2
              exit 1
            fi
            sleep 3
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy current county-check data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
