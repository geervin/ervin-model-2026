name: Publish Ervin Model website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate historical polling audit
        run: python3 scripts/validate_data.py
      - name: Check dashboard JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          doc = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', doc)
          Path('/tmp/dashboard-script.js').write_text('\\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/dashboard-script.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
