<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Michigan county-first election-night browser smoke</title></head>
<body><pre id="report" data-status="RUNNING">Testing county election-night view…</pre>
<script>
(async()=>{
 const out=document.getElementById("report"),checks=[],errors=[];
 const check=(v,label)=>{if(!v)throw Error(label);checks.push(label)};
 async function load(path,width=1200){
  const frame=document.createElement("iframe");frame.style.width=width+"px";frame.style.height="940px";
  const done=new Promise((yes,no)=>{frame.onload=yes;frame.onerror=()=>no(Error("iframe unavailable"))});
  frame.src=path;document.body.append(frame);await done;return {frame,doc:frame.contentDocument,win:frame.contentWindow};
 }
 const nap=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 try{
  const item=await load("../michigan/election-night/?demo=1"),d=item.doc,w=item.win,el=id=>d.getElementById(id);
  w.addEventListener("error",e=>errors.push(e.message));
  for(let i=0;i<130&&(d.querySelectorAll("#countyBoundaryMap path").length!==83||d.querySelectorAll("#countyRows tr").length!==83);i++)await nap(70);
  check(d.querySelector(".site-header .site-emblem")?.textContent==="E","Shared E-square branding preserved");
  check(d.querySelectorAll(".site-header .site-nav a").length>=4,"All navigation links remain accessible");
  check(d.querySelectorAll("#countyBoundaryMap path[data-county]").length===83,"Exactly 83 native county polygons");
  check(d.querySelectorAll("#countyRows tr").length===83,"Full county results table");
  check(!el("precinctBoundaryMap")&&!d.querySelector(".precinct-outlook-panel"),"Speculative precinct map has been removed");
  check(!!el("precinctRows")&&!!el("precinctSearch"),"Verified precinct returns table remains available");
  check(el("countyBoundaryMap").getAttribute("preserveAspectRatio")==="xMidYMid meet","SVG proportion preserving projection enabled");
  const box=el("countyBoundaryMap").getBoundingClientRect();
  check(box.width>650&&Math.abs(box.width/box.height-880/650)<.035,"County map scales without vertical or horizontal stretching");
  check(el("countyMapStatus").textContent.includes("native geographic proportions"),"Map status discloses geographic correction");
  for(let i=0;i<110&&el("precinctRows").querySelectorAll("tr").length!==3;i++)await nap(85);
  for(let i=0;i<110&&d.querySelectorAll("#countyBoundaryMap .reported-d,#countyBoundaryMap .reported-r").length===0;i++)await nap(85);
  check(el("statusHeading").textContent.includes("DEMONSTRATION"),"Fixture data visibly marked demonstration");
  check(d.querySelectorAll("#countyBoundaryMap .reported-d,#countyBoundaryMap .reported-r").length>0,"Only reported fixture counties colored");
  check(el("precinctRows").querySelectorAll("tr").length===3,"Three independently sourced fixture reporting units present");
  const oakland=d.querySelector('#countyBoundaryMap path[data-county="Oakland"]');
  oakland.dispatchEvent(new w.MouseEvent("click",{bubbles:true}));
  check(w.location.search.includes("county=Oakland"),"County click creates shareable county URL");
  check(oakland.classList.contains("selected"),"County click highlights geographic polygon");
  check(el("countyCardTitle").textContent==="Oakland County","County results desk opens selected county");
  check(el("countyCardDem").textContent==="802"&&el("countyCardRep").textContent==="917","County desk shows verified fixture units, not forecast votes");
  check(!el("copyCountyLink").disabled,"County sharing control enabled on selection");
  check(d.querySelectorAll(".county-card .candidate-portrait img").length===2,"Candidate portraits retained");
  el("expandCountyMap").click();
  check(el("countyMapPanel").classList.contains("is-expanded"),"Expanded county map opens");
  el("expandCountyMap").click();
  check(!el("countyMapPanel").classList.contains("is-expanded"),"Expanded county map closes");
  w.dispatchEvent(new w.CustomEvent("ervin:county-totals",{detail:{counties:[{
   county:"Oakland",dem:1800,rep:1200,other:100,asOf:"2026-11-03T20:53:00-05:00",
   sourceUrl:"https://www.michigan.gov/sos/elections/election-results-and-data",reportingStatus:"partial"
  }]}}));
  check(el("reportedD").textContent==="3,744"&&el("reportedR").textContent==="2,272","County-wide verified source replaces partial precinct subtotal");
  check(oakland.classList.contains("reported-d"),"County colors reflect source-attributed county tally");
  w.dispatchEvent(new w.CustomEvent("ervin:county-totals",{detail:{counties:[]}}));
  check(el("reportedD").textContent==="2,746"&&el("reportedR").textContent==="1,989","Restored fixture totals without double counting");
  el("countyAll").click();
  check(!w.location.search.includes("county=Oakland"),"Clear county resets shareable URL");
  check(!d.querySelector('#countyBoundaryMap path.selected'),"Clear county resets visual highlight");
  const rows=el("countyRows");
  el("countySearch").value="Oakland";
  el("countySearch").dispatchEvent(new w.Event("input",{bubbles:true}));
  check(rows.querySelectorAll("tr").length===1,"County search filters results");
  el("precinctSearch").value="Wayne";
  el("precinctSearch").dispatchEvent(new w.Event("input",{bubbles:true}));
  check(el("precinctRows").querySelectorAll("tr").length===1,"Verified precinct table search works");
  check(!!el("clerkWatchRows")&&!!el("clerkWatchFilter"),"County clerk source watch remains available");
  check(d.querySelectorAll("#officialSources .source-shortcuts a").length>=6,"Official county and state references retained");
  check(errors.length===0,"No synchronous browser errors");
  out.dataset.status="PASS";out.textContent="PASS "+checks.length+" checks\n"+checks.map(x=>"✓ "+x).join("\n");
 }catch(e){out.dataset.status="FAIL";out.textContent="FAIL: "+e.stack+"\n"+errors.join("\n");}
})();
</script></body></html>
